<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacks Collectibles &amp; Goods</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary: #0284c7; --dark: #0f172a; --bg: #f8fafc; --border: #e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:#1e293b; padding-bottom:5rem; }
    header { background:#fff; border-bottom:1px solid var(--border); padding:0.75rem 1rem; position:sticky; top:0; z-index:30; }
    .nav { max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:1.1rem; font-weight:800; color:var(--primary); text-decoration:none; }
    .logo span { color:var(--dark); }
    .hero { max-width:1100px; margin:1rem auto 0; padding:0 1rem; }
    .hero-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:1rem; display:flex; gap:0.85rem; align-items:center; }
    .avatar { width:48px; height:48px; border-radius:50%; background:var(--dark); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2rem; flex-shrink:0; }
    .hero-info h1 { font-size:1.05rem; color:var(--dark); }
    .hero-info p { font-size:0.8rem; color:#64748b; }
    .badge { display:inline-block; background:#e0f2fe; color:var(--primary); font-size:0.7rem; font-weight:700; padding:0.1rem 0.4rem; border-radius:4px; margin-top:0.2rem; }
    .filters { max-width:1100px; margin:0.8rem auto; padding:0 1rem; display:flex; gap:0.5rem; overflow-x:auto; scrollbar-width:none; }
    .pill { background:#fff; border:1px solid var(--border); padding:0.35rem 0.8rem; border-radius:20px; font-size:0.8rem; font-weight:600; white-space:nowrap; cursor:pointer; }
    .pill.active { background:var(--dark); color:#fff; border-color:var(--dark); }
    .grid { max-width:1100px; margin:0 auto; padding:0 1rem; display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:0.85rem; }
    .card { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
    .card img { width:100%; height:140px; object-fit:cover; background:#e2e8f0; }
    .card-body { padding:0.65rem; display:flex; flex-direction:column; flex:1; }
    .price { font-size:1.15rem; font-weight:800; color:var(--dark); }
    .title { font-size:0.85rem; font-weight:600; margin:0.2rem 0; color:#334155; line-height:1.2; }
    .meta { font-size:0.75rem; color:#64748b; margin-top:auto; padding-top:0.4rem; }
    .bar { position:fixed; bottom:0; left:0; width:100%; background:#fff; border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; height:56px; z-index:40; }
    .bar-btn { background:none; border:none; color:#64748b; font-size:0.75rem; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
    .bar-btn.active { color:var(--primary); }
    .fab { width:46px; height:46px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; border:none; font-size:1.2rem; transform:translateY(-10px); box-shadow:0 4px 10px rgba(2,132,199,0.4); cursor:pointer; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; align-items:center; justify-content:center; padding:1rem; }
    .modal.active { display:flex; }
    .box { background:#fff; border-radius:12px; width:100%; max-width:400px; padding:1.25rem; position:relative; }
    .box h2 { font-size:1.1rem; margin-bottom:0.8rem; }
    .box input, .box select { width:100%; padding:0.55rem; margin-bottom:0.7rem; border:1px solid var(--border); border-radius:6px; font-size:0.85rem; }
    .btn { width:100%; padding:0.65rem; border-radius:6px; border:none; background:var(--primary); color:#fff; font-weight:600; cursor:pointer; }
    .close-btn { position:absolute; top:0.8rem; right:0.8rem; background:none; border:none; font-size:1.2rem; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a href="#" class="logo"><i class="fa-solid fa-layer-group"></i> Stacks <span>Collectibles &amp; Goods</span></a>
    </div>
  </header>

  <div class="hero">
    <div class="hero-card">
      <div class="avatar">DS</div>
      <div class="hero-info">
        <h1 id="pStore">Stacks Collectibles &amp; Goods</h1>
        <p id="pFounder">Founder: Dustin Stacks &bull; Tempe, AZ</p>
        <span class="badge"><i class="fa-solid fa-check-circle"></i> Verified Founder</span>
      </div>
    </div>
  </div>

  <div class="filters">
    <button class="pill active" onclick="setCat('All')">All Items</button>
    <button class="pill" onclick="setCat('Coins & Currency')">Coins</button>
    <button class="pill" onclick="setCat('Trading Cards')">Cards</button>
    <button class="pill" onclick="setCat('Collectibles & Toys')">Collectibles</button>
    <button class="pill" onclick="setCat('Electronics & Audio')">Audio &amp; Gear</button>
  </div>

  <div class="grid" id="grid"></div>

  <nav class="bar">
    <button class="bar-btn active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fa-solid fa-store"></i>Store</button>
    <button class="fab" onclick="showModal('postModal')"><i class="fa-solid fa-plus"></i></button>
    <button class="bar-btn" onclick="showModal('profModal')"><i class="fa-solid fa-user-gear"></i>Founder</button>
  </nav>

  <div class="modal" id="postModal">
    <div class="box">
      <button class="close-btn" onclick="hideModal('postModal')">&times;</button>
      <h2>Add New Item</h2>
      <form onsubmit="postItem(event)">
        <input type="text" id="t" placeholder="Title" required>
        <select id="c">
          <option value="Coins & Currency">Coins &amp; Currency</option>
          <option value="Trading Cards">Trading Cards</option>
          <option value="Collectibles & Toys">Collectibles &amp; Toys</option>
          <option value="Electronics & Audio">Electronics &amp; Audio</option>
          <option value="General Goods">General Goods</option>
        </select>
        <input type="number" id="p" placeholder="Price ($)" required>
        <input type="text" id="img" placeholder="Image URL (https://...)" required>
        <button type="submit" id="postSub" class="btn">Post Listing</button>
      </form>
    </div>
  </div>

  <div class="modal" id="profModal">
    <div class="box">
      <button class="close-btn" onclick="hideModal('profModal')">&times;</button>
      <h2>Founder Store Info</h2>
      <form onsubmit="saveProf(event)">
        <input type="text" id="profStore" value="Stacks Collectibles & Goods" required>
        <input type="text" id="profName" value="Dustin Stacks" required>
        <button type="submit" class="btn">Update Profile</button>
      </form>
    </div>
  </div>

  <script>
    const sb = supabase.createClient("https://rxjueszszoggbdhichhq.supabase.co", "sb_publishable_gcmFLllwp9bJKEdBNyLnRw_oLukdVJB");
    let items = [], currentCat = "All";

    async function loadData() {
      const { data: prof } = await sb.from('store_profile').select('*').eq('id', 1).single();
      if (prof) {
        document.getElementById('pStore').innerText = prof.store_name;
        document.getElementById('pFounder').innerText = `Founder: ${prof.founder_name} • ${prof.location}`;
        document.getElementById('profStore').value = prof.store_name;
        document.getElementById('profName').value = prof.founder_name;
      }
      const { data } = await sb.from('listings').select('*').eq('status', 'active').order('id', { ascending: false });
      items = data || [];
      render();
    }

    function render() {
      const g = document.getElementById('grid');
      g.innerHTML = "";
      const list = currentCat === "All" ? items : items.filter(x => x.category === currentCat);
      if (!list.length) {
        g.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#64748b;padding:2rem;">No items listed in this section yet.</p>`;
        return;
      }
      list.forEach(i => {
        g.innerHTML += `
          <div class="card">
            <img src="${i.image}" onerror="this.src='https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&w=400&q=80'">
            <div class="card-body">
              <div class="price">$${i.price}</div>
              <div class="title">${i.title}</div>
              <div class="meta">${i.location || 'Tempe, AZ'} • ${i.seller || 'Dustin S.'}</div>
            </div>
          </div>`;
      });
    }

    function setCat(c) {
      currentCat = c;
      document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.innerText === (c === "All" ? "All Items" : (c === "Coins & Currency" ? "Coins" : c === "Trading Cards" ? "Cards" : c === "Collectibles & Toys" ? "Collectibles" : "Audio & Gear"))));
      render();
    }

    async function postItem(e) {
      e.preventDefault();
      const b = document.getElementById('postSub');
      b.innerText = "Posting...";
      b.disabled = true;
      await sb.from('listings').insert([{
        title: document.getElementById('t').value,
        category: document.getElementById('c').value,
        price: parseInt(document.getElementById('p').value),
        image: document.getElementById('img').value,
        location: "Tempe, AZ",
        seller: "Dustin S. (Founder)",
        status: "active"
      }]);
      b.innerText = "Post Listing";
      b.disabled = false;
      hideModal('postModal');
      e.target.reset();
      loadData();
    }

    async function saveProf(e) {
      e.preventDefault();
      await sb.from('store_profile').upsert({
        id: 1,
        store_name: document.getElementById('profStore').value,
        founder_name: document.getElementById('profName').value
      });
      hideModal('profModal');
      loadData();
    }

    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function hideModal(id) { document.getElementById(id).classList.remove('active'); }

    loadData();
  </script>
</body>
</html>
