<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacks Collectibles & Goods | Local Buy & Sell</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --dark: #0f172a;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 3rem;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .logo span {
      color: var(--dark);
    }

    .search-bar {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      outline: none;
      font-size: 0.95rem;
      background: #f1f5f9;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .search-bar i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .btn {
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .filter-bar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1rem;
    }

    .filter-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      overflow-x: auto;
      gap: 0.5rem;
      scrollbar-width: none;
    }

    .cat-pill {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      white-space: nowrap;
    }

    .cat-pill.active {
      background: var(--dark);
      color: white;
    }

    .location-strip {
      max-width: 1200px;
      margin: 1rem auto 0;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .location-strip strong {
      color: var(--dark);
    }

    main {
      max-width: 1200px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .card-img-wrap {
      position: relative;
      padding-top: 80%;
      background: #e2e8f0;
      overflow: hidden;
    }

    .card-img-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-deal {
      position: absolute;
      bottom: 0.6rem;
      left: 0.6rem;
      background: rgba(15, 23, 42, 0.85);
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .card-body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-price {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 0.2rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--dark);
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.5rem;
      border-top: 1px solid #f1f5f9;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      border: none;
      background: transparent;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--primary);
    }

    .details-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    footer {
      background: white;
      border-top: 1px solid var(--border);
      padding: 2rem 1rem;
      margin-top: 3rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>Stacks <strong>Collectibles &amp; Goods</strong></span>
      </a>

      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search items, cards, coins, audio..." oninput="handleSearch()">
      </div>

      <div class="nav-actions">
        <button class="btn btn-primary" onclick="openModal('listingModal')">
          <i class="fa-solid fa-camera"></i> Post an Item
        </button>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <div class="filter-container" id="categoryTabs">
      <div class="cat-pill active" onclick="filterCategory('All')">All Items</div>
      <div class="cat-pill" onclick="filterCategory('Coins & Currency')">Coins &amp; Currency</div>
      <div class="cat-pill" onclick="filterCategory('Trading Cards')">Trading Cards</div>
      <div class="cat-pill" onclick="filterCategory('Collectibles & Toys')">Collectibles &amp; Toys</div>
      <div class="cat-pill" onclick="filterCategory('Electronics & Audio')">Electronics &amp; Audio</div>
      <div class="cat-pill" onclick="filterCategory('General Goods')">General Goods</div>
    </div>
  </div>

  <div class="location-strip">
    <i class="fa-solid fa-location-dot" style="color: var(--primary);"></i>
    <span>Browsing listings around <strong>Tempe, AZ</strong> &amp; surrounding areas</span>
  </div>

  <main>
    <div class="items-grid" id="itemsFeed"></div>
  </main>

  <!-- Create Listing Modal -->
  <div class="modal-overlay" id="listingModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('listingModal')">&times;</button>
      <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Post an Item for Sale</h2>
      
      <form id="createListingForm" onsubmit="handleCreateListing(event)">
        <div class="form-group">
          <label>What are you selling?</label>
          <input type="text" id="itemTitle" placeholder="e.g. 1884-CC Morgan Silver Dollar" required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="itemCategory" required>
            <option value="Coins & Currency">Coins &amp; Currency</option>
            <option value="Trading Cards">Trading Cards</option>
            <option value="Collectibles & Toys">Collectibles &amp; Toys</option>
            <option value="Electronics & Audio">Electronics &amp; Audio</option>
            <option value="General Goods">General Goods</option>
          </select>
        </div>

        <div class="form-group">
          <label>Price ($ Cash / Meetup)</label>
          <input type="number" step="1" id="itemPrice" placeholder="50" required>
        </div>

        <div class="form-group">
          <label>Pickup Location</label>
          <input type="text" id="itemLocation" placeholder="e.g. Tempe, AZ" value="Tempe, AZ" required>
        </div>

        <div class="form-group">
          <label>Image Link / URL</label>
          <input type="url" id="itemImage" placeholder="https://..." required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
          Post Listing Now
        </button>
      </form>
    </div>
  </div>

  <!-- Item Details Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Stacks Collectibles and Goods &bull; Local Marketplace &amp; Community Trading</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://rxjueszszoggbdhichhq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gcmFLllwp9bJKEdBNyLnRw_oLukdVJB";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let inventory = [];
    let activeCategory = "All";
    let searchQuery = "";

    function formatTimeAgo(dateString) {
      const date = new Date(dateString);
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return "Just now";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    async function fetchListings() {
      const feed = document.getElementById("itemsFeed");
      feed.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">Loading live items...</p>`;

      const { data, error } = await supabaseClient
        .from('listings')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error("Supabase fetch error:", error);
        feed.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red; padding: 3rem;">Unable to load listings. Check database configuration.</p>`;
        return;
      }

      inventory = data || [];
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById("itemsFeed");
      feed.innerHTML = "";

      const filtered = inventory.filter(item => {
        const matchCat = activeCategory === "All" || item.category === activeCategory;
        const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        feed.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">No local listings found matching that search.</p>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openItemDetails(item.id);
        const timeDisplay = item.created_at ? formatTimeAgo(item.created_at) : "Available";
        card.innerHTML = `
          <div class="card-img-wrap">
            <span class="badge-deal"><i class="fa-solid fa-handshake"></i> Local Pickup</span>
            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&w=600&q=80'">
          </div>
          <div class="card-body">
            <div class="card-price">$${item.price}</div>
            <div class="card-title">${item.title}</div>
            <div class="card-meta">
              <span><i class="fa-solid fa-location-dot"></i> ${item.location}</span>
              <span>${timeDisplay}</span>
            </div>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll(".cat-pill").forEach(el => {
        el.classList.toggle("active", el.innerText.trim() === (cat === "All" ? "All Items" : cat));
      });
      renderFeed();
    }

    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value;
      renderFeed();
    }

    function openItemDetails(id) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;

      const timeDisplay = item.created_at ? formatTimeAgo(item.created_at) : "Recently";
      const detailContent = document.getElementById("detailContent");
      detailContent.innerHTML = `
        <img src="${item.image}" style="width: 100%; height: 260px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem;" onerror="this.src='https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&w=600&q=80'">
        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--dark);">$${item.price}</h2>
        <h3 style="font-size: 1.15rem; margin-top: 0.25rem;">${item.title}</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
          <i class="fa-solid fa-tag"></i> ${item.category} &bull; <i class="fa-solid fa-location-dot"></i> ${item.location}
        </p>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Seller: <strong>${item.seller}</strong> &bull; Posted ${timeDisplay}</p>
        
        <div class="details-actions">
          <button class="btn btn-primary" style="flex: 1; justify-content: center; padding: 0.75rem;" onclick="alert('OfferUp / Marketplace style chat connects here. Seller will be notified!')">
            <i class="fa-solid fa-message"></i> Ask Seller / Make Offer
          </button>
        </div>
      `;
      openModal("detailModal");
    }

    function openModal(id) {
      document.getElementById(id).classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    async function handleCreateListing(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Posting to Database...";

      const title = document.getElementById("itemTitle").value;
      const category = document.getElementById("itemCategory").value;
      const price = parseInt(document.getElementById("itemPrice").value);
      const location = document.getElementById("itemLocation").value;
      const image = document.getElementById("itemImage").value;

      const { data, error } = await supabaseClient
        .from('listings')
        .insert([
          {
            title,
            category,
            price,
            location,
            seller: "Dustin S. (Founder)",
            image
          }
        ])
        .select();

      submitBtn.disabled = false;
      submitBtn.innerText = "Post Listing Now";

      if (error) {
        alert("Error posting listing: " + error.message);
        return;
      }

      document.getElementById("createListingForm").reset();
      closeModal("listingModal");
      await fetchListings();
    }

    fetchListings();
  </script>
</body>
</html>
